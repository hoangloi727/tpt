<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b6bcb" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="./logo/logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="Trợ lý ngoại tuyến quản lý công tác Đội, thi đua lớp và báo cáo dành cho Tổng phụ trách Đội."
    />
    <title>Trợ lý Tổng phụ trách Đội</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body data-paper="landscape">
    <section
      class="activation-screen"
      id="activationScreen"
      aria-labelledby="activationTitle"
    >
      <div class="activation-card">
        <img
          class="activation-logo"
          src="./logo/logo.png"
          alt=""
          aria-hidden="true"
        />
        <h1 id="activationTitle">TRỢ LÝ TỔNG PHỤ TRÁCH ĐỘI</h1>
        <form id="activationForm">
          <div class="field" id="schoolSelectField">
            <label for="activationSchool">Trường</label>
            <select id="activationSchool" required></select>
          </div>
          <div class="field hidden" id="schoolNameField">
            <label for="activationSchoolName">Tên trường đầu tiên</label>
            <input id="activationSchoolName" maxlength="200" disabled />
          </div>
          <div class="field hidden" id="displayNameField">
            <label for="displayName">Tên hiển thị của root</label>
            <input id="displayName" autocomplete="name" disabled />
          </div>
          <div class="field">
            <label for="activationUsername">Tên đăng nhập</label>
            <input
              id="activationUsername"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>
          <div class="field">
            <label for="activationCode" id="activationPasswordLabel">Mật khẩu</label>
            <div class="password-wrap">
              <input
                id="activationCode"
                type="password"
                autocomplete="current-password"
                required
              /><button
                type="button"
                id="toggleActivationCode"
                aria-label="Hiện hoặc ẩn mã truy cập"
              >
                ◉
              </button>
            </div>
          </div>
          <div class="field hidden" id="confirmPasswordField">
            <label for="confirmActivationCode">Nhập lại mật khẩu</label>
            <input
              id="confirmActivationCode"
              type="password"
              autocomplete="new-password"
              disabled
            />
          </div>
          <div class="activation-status" id="activationStatus" role="status">
            Nhập tài khoản để mở phiên làm việc. Ứng dụng không ghi nhớ mật khẩu.
          </div>
          <button
            class="btn primary"
            id="activateButton"
            style="width: 100%"
            type="submit"
          >
            Mở ứng dụng
          </button>
        </form>
      </div>
    </section>
    <div class="app hidden" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">Đ</div>
          <div class="brand-text">
            <strong id="selectedSchoolName">TRỢ LÝ TỔNG PHỤ TRÁCH ĐỘI</strong><span>Công tác Đội</span>
          </div>
        </div>
        <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      </aside>
      <header class="topbar">
        <button
          class="icon-btn"
          id="toggleSidebar"
          title="Thu gọn thanh bên"
          aria-label="Thu gọn thanh bên"
        >
          ☰
        </button>
        <details class="scope-menu" id="dataScope">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h16M7 12h10M10 19h4" stroke-linecap="round"/></svg>
            <span class="scope-label"><strong>Phạm vi dữ liệu</strong><small id="scopeSummary"></small></span>
            <svg class="scope-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </summary>
          <div class="scope-dropdown">
            <div class="field scope-field-wide"><label for="schoolSelect">Trường</label><select id="schoolSelect"></select></div>
            <div class="field"><label for="yearSelect">Năm học</label><select id="yearSelect"></select></div>
            <div class="field"><label for="semesterSelect">Học kỳ</label><select id="semesterSelect"></select></div>
            <div class="field"><label for="weekSelect">Tuần</label><select id="weekSelect"></select></div>
            <div class="field"><label for="campusSelect">Cơ sở</label><select id="campusSelect"></select></div>
          </div>
        </details>
        <div class="searchbox">
          <label class="sr-only" for="globalSearch">Tìm kiếm</label
          ><input
            id="globalSearch"
            placeholder="Tìm công việc, lớp, hoạt động…"
            autocomplete="off"
          />
        </div>
        <button class="btn primary" id="quickAdd">＋ Thêm nhanh</button>
        <details class="account-menu" id="accountMenu">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke-linecap="round"/></svg>
            <span class="account-name" id="sessionChip">Tài khoản</span>
            <svg class="account-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </summary>
          <div class="account-dropdown">
            <button type="button" id="editPersonalInfo">Chỉnh sửa thông tin cá nhân</button>
            <button type="button" id="logoutMenu">Đăng xuất</button>
          </div>
        </details>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
    <div class="modal-layer" id="modalLayer" aria-hidden="true">
      <section class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modalTitle"></h2>
          <button class="icon-btn" id="modalClose" aria-label="Đóng">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
      </section>
    </div>
    <div class="toast-zone" id="toasts" aria-live="polite"></div>
    <input
      type="file"
      id="backupFileInput"
      class="hidden"
      accept=".json,.tdt,.tptbackup,application/json"
    />
    <input
      type="file"
      id="csvFileInput"
      class="hidden"
      accept=".csv,text/csv"
    />
    <input
      type="file"
      id="documentFileInput"
      class="hidden"
      multiple
      accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.webp,.zip"
    />
    <input
      type="file"
      id="versionFileInput"
      class="hidden"
      accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.webp,.zip"
    />
    <script src="./app-config.js"></script>
    <script src="./scripts/api-data-provider.js"></script>
    <script src="./scripts/app-utils.js"></script>
    <script src="./scripts/app-catalog.js"></script>
    <script src="./scripts/app-schema.js"></script>
    <script src="./scripts/browser-runtime.js"></script>
    <script src="./scripts/score-engine.js"></script>
    <script src="./scripts/backup-codec.js"></script>
    <script src="./scripts/custom-fields.js"></script>
    <script src="./scripts/pwa-runtime.js"></script>
    <script src="./scripts/report-formatters.js"></script>
    <script src="./scripts/backup-service.js"></script>
    <script src="./scripts/app.js"></script>
  </body>
</html>
